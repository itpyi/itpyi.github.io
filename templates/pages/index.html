<!DOCTYPE html>
<html lang="zh-Hans">
{{ HEAD }}
<body class="homepage-shell">
    <nav class="topnav">
        <div class="nav-container">
            <div class="logo-container">
                <a href="#top">
                    <span data-lang="zh">{{ LOGO_ZH }}</span>
                    <span data-lang="en" style="display: none;">{{ LOGO_EN }}</span>
                </a>
            </div>
            <div class="nav-right">
                <div class="global-lang-switcher">
                    <button class="global-lang-button" aria-label="切换语言">
                        <i class="fas fa-language"></i>
                    </button>
                    <ul class="global-lang-menu">
                        <li data-lang="zh" class="active">汉语</li>
                        <li data-lang="en">English</li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="homepage-main">
        <header id="top" class="home-cover">
            <button class="cover-enter-zone" type="button" aria-label="Enter homepage">
                <span class="cover-enter-hint" data-lang="zh">{{ ENTER_HINT_ZH }}</span>
                <span class="cover-enter-hint" data-lang="en" style="display: none;">{{ ENTER_HINT_EN }}</span>
            </button>
            <div class="home-cover-panel home-cover-panel-left" aria-hidden="true"></div>
            <div class="home-cover-panel home-cover-panel-right" aria-hidden="true"></div>
            <div class="h1-container">
                <h1 class="fade-in-1">攬月閣</h1>
{{ QUOTES }}
            </div>
        </header>

        <section class="home-split" aria-labelledby="homeSplitTitle">
            <h1 id="homeSplitTitle" class="sr-only">
                <span data-lang="zh">{{ SR_TITLE_ZH }}</span>
                <span data-lang="en" style="display: none;">{{ SR_TITLE_EN }}</span>
            </h1>
{{ ROUTES }}
        </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
